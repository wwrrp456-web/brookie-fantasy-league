<!doctype html>
<html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقارنة الرموز الأصلية والمتجهة</title><style>
:root{--c-bg:#0A0B1E;--c-surface-1:#12142E;--c-text:#F4F5FF;--c-text-2:#A9ADCF;--c-brand:#7B61FF;--c-border:rgba(255,255,255,.08);--font:Tajawal,system-ui,sans-serif;--sp-2:8px;--sp-4:16px;--sp-6:24px;--r-md:12px}*{box-sizing:border-box}body{margin:0;padding:var(--sp-4);background:var(--c-bg);color:var(--c-text);font:16px/1.7 var(--font)}main{max-width:1120px;margin:auto}h1{font-size:24px}h2{font-size:20px}p{color:var(--c-text-2)}section{margin-block:var(--sp-6);border:1px solid var(--c-border);border-radius:var(--r-md);overflow:hidden}.samples{overflow:auto}.theme{padding:var(--sp-4);background:var(--c-bg);color:var(--c-text)}.theme.light{background:#FFFFFF;color:var(--c-surface-1)}.pairs{display:flex;gap:var(--sp-6);align-items:start;width:max-content;min-width:100%}.pair{display:grid;grid-template-columns:repeat(2,var(--size));gap:var(--sp-4);direction:ltr}figure{margin:0;text-align:center}figcaption{font-size:14px;direction:rtl}.visual{display:flex;align-items:center;justify-content:center;width:var(--size);height:var(--size)}.visual img,.visual svg{display:block;width:100%;height:100%;object-fit:contain}.motif .theme:not(.light) .original{filter:brightness(0) invert(1)}.motif .light .original{filter:brightness(0)}.size{margin:0 0 var(--sp-2)}.error{color:var(--c-brand)}.brand .visual{height:auto;aspect-ratio:480/546}.brand .light-logo .visual{aspect-ratio:520/594}.mark .visual{aspect-ratio:1}.mark .visual svg{width:auto;height:60%;max-width:60%}
.motif .theme{color:#FFFFFF}.motif .theme.light{color:#000000}</style><main><h1>مقارنة الرموز الأصلية والمتجهة</h1><p>كل زوج بالحجم نفسه: 48 و96 و240px. الرموز بلون واحد، مع الحفاظ على نسب المصدر وفراغاته. اسحب منطقة المقارنة أفقيًا عند الحاجة. افتح الصفحة عبر خادم محلي.</p><img id="logoImg" alt="" hidden><script src="../../../js/data/brand-assets.js"></script><script>
let instance=0;
async function vector(file,host){
 const response=await fetch(file);if(!response.ok)throw Error('تعذّر تحميل '+file);
 const doc=new DOMParser().parseFromString(await response.text(),'image/svg+xml');
 if(doc.querySelector('parsererror'))throw Error('ملف متجه غير صالح: '+file);
 const root=doc.documentElement;const prefix='comparison-'+(++instance)+'-';
 for(const el of root.querySelectorAll('[id]')){const old=el.id;el.id=prefix+old;for(const node of root.querySelectorAll('*'))for(const a of [...node.attributes])if(a.value.includes('url(#'+old+')'))node.setAttribute(a.name,a.value.replaceAll('url(#'+old+')','url(#'+prefix+old+')'));}
 root.setAttribute('role','img');root.setAttribute('aria-label','النسخة المتجهة');host.append(document.importNode(root,true));
}
function figure(label){const f=document.createElement('figure');const v=document.createElement('div');v.className='visual';const c=document.createElement('figcaption');c.textContent=label;f.append(v,c);return {f,v};}
async function pair(parent,source,file,size,originalClass='original'){
 const p=document.createElement('div');p.className='pair';p.style.setProperty('--size',size+'px');
 const a=figure('الأصل'),b=figure('المتجه');const img=document.createElement('img');img.src=source;img.alt='الصورة الأصلية';img.className=originalClass;a.v.append(img);p.append(a.f,b.f);parent.append(p);await vector(file,b.v);
}
function section(name,cls=''){const s=document.createElement('section');s.className=cls;const h=document.createElement('h2');h.textContent=name;s.append(h);document.querySelector('main').append(s);return s;}
function theme(s,light){const t=document.createElement('div');t.className='theme'+(light?' light':'');const h=document.createElement('h3');h.textContent=light?'الخلفية الفاتحة':'الخلفية الداكنة';const scroll=document.createElement('div');scroll.className='samples';const ps=document.createElement('div');ps.className='pairs';scroll.append(ps);t.append(h,scroll);s.append(t);return ps;}
function fail(e){const p=document.createElement('p');p.className='error';p.textContent=e.message;document.querySelector('main').append(p);throw e;}

(async()=>{for(const [name,source] of [['lion',LION_ICON_PNG_BASE64],
['cannon',CANNON_ICON_PNG_BASE64],
['saudi-map',SAUDI_MAP_ICON_PNG_BASE64],
['wolf',WOLF_ICON_PNG_BASE64],
['ball',BALL_ICON_PNG_BASE64],
['liverbird',LIVERBIRD_ICON_PNG_BASE64],
['eiffel',EIFFEL_ICON_PNG_BASE64],
['clover',CLOVER_ICON_PNG_BASE64],
['galatasaray',GALATASARAY_ICON_PNG_BASE64],
['eagle',EAGLE_ICON_PNG_BASE64],
['ship',SHIP_ICON_PNG_BASE64]]){const s=section(name,'motif');for(const light of [false,true]){const ps=theme(s,light);for(const size of [48,96,240]){const item=document.createElement('div');const h=document.createElement('h4');h.className='size';h.textContent=size+'px';item.append(h);ps.append(item);await pair(item,source,name+'.svg',size);}}}})().catch(fail);
</script></main></html>
